name: Build download zips

on:
  push:
    branches: [main]
    paths:
      - "shadow-and-teach/**"
      - "tournament-forge/**"
      - "kick-start/**"
      - "research-solving/**"
      - "problem-solve/**"
      - "scripts/build-zips.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build-zips.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          git diff --cached --quiet || { git commit -m "Rebuild download zips"; git push; }
